version: '3'

services:
  adk-voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_KEY=development-key
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./credentials.json:/app/credentials.json
    env_file:
      - .env
